<!doctype html>
<!--
  DIAGNÓSTICO DE TRÁMITES — Generación Genial · Módulo I
  Cada participante responde, desde su celular, 12 preguntas sobre los trámites de la institución donde trabaja.
  La pantalla ordena las instituciones por su índice de deficiencia (0 = sin problemas, 100 = crítico):
  la de mayor puntaje es la institución prioritaria para la app del proyecto «Mara Digital en Acción».
  · Pantalla (videobeam): tramites.html?pantalla      · Participantes: escanean el QR (tramites.html)
  · Teclas: Espacio = siguiente · E = descargar Excel · R = reiniciar · F = pantalla completa
  · Las respuestas se acumulan entre talleres hasta que se reinicia (colección «trivia», sala «diag-genial»).
-->
<html lang="es">

<style>

body{overflow-x:hidden}

.hidden{display:none!important}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--c);color:var(--ink);font:800 13px var(--head);letter-spacing:.08em;text-transform:uppercase}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:16px;background:var(--c);color:var(--ink);font:800 17px var(--head);box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .12s}
.btn:active{transform:scale(.96)}.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}.btn[disabled]{opacity:.4}
.banner{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:99;background:#7A1B22;padding:10px 16px;border-radius:12px;font-weight:700;max-width:92vw;text-align:center}

/* ---------------- phone ---------------- */
.ph{max-width:520px;margin:0 auto;min-height:100%;padding:max(16px,env(safe-area-inset-top)) 16px 28px;display:flex;flex-direction:column;gap:14px}

.ph .big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
.ph .big h2{font-size:28px}.ph .big p{color:var(--mut);margin:0}
.ph input{width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font:700 20px var(--body);text-align:center}
.ph input:focus{outline:none;border-color:var(--c)}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.rhead b{font:800 13px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--glow)}
.timer{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.timer i{display:block;height:100%;background:var(--c);transform-origin:left;transition:transform .25s linear}
.rtitle h2{font-size:23px}.rtitle p{margin:4px 0 0;color:var(--mut)}
.olist{display:flex;flex-direction:column;gap:10px}
.oitem{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;border-radius:16px;background:var(--card);border:2px solid var(--line);font:700 17px var(--body);min-height:58px}
.oitem .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);font:800 17px var(--head);color:var(--mut)}
.oitem.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}.oitem.on .n{background:var(--c);border:0;color:var(--ink)}
.acts{display:flex;gap:10px}.acts .btn{flex:1}
.ccard{min-height:150px;display:grid;place-items:center;text-align:center;padding:24px;border-radius:24px;background:#fff;color:var(--ink);font:800 22px var(--head);line-height:1.2;box-shadow:0 14px 34px rgba(0,0,0,.4);animation:pop .3s ease}
.ccard.ok{background:#D8F5E3}.ccard.bad{background:#FBDADB;animation:shake .35s}
@keyframes pop{from{transform:scale(.85) rotate(-3deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.bins{display:grid;gap:10px}.bins .btn{padding:20px 10px;font-size:18px;min-height:66px}
.prog{text-align:center;color:var(--mut);font-weight:700}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pairs .col{display:flex;flex-direction:column;gap:10px}
.pitem{padding:12px 10px;border-radius:14px;background:var(--card);border:2px solid var(--line);font:700 15px var(--body);min-height:64px;text-align:center;display:grid;place-items:center;line-height:1.2}
.pitem.sel{border-color:#fff;box-shadow:0 0 0 3px var(--c)}
.hint{padding:14px;border-radius:16px;background:var(--card);text-align:center;font-weight:700;color:var(--mut)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}

.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:46px;height:52px;border-radius:12px;background:#fff;color:var(--ink);font:800 24px var(--head);box-shadow:0 5px 0 rgba(0,0,0,.25)}.tile.used{visibility:hidden}
.done{font:900 54px var(--head);color:var(--glow)}

/* ---------------- host (videobeam) ---------------- */
.hs{position:fixed;inset:0;display:flex;flex-direction:column;padding:2.2vw 3vw}
.hs .top{display:flex;align-items:center;gap:1.4vw}.hs .top img{height:4.2vw}.hs .top .t b{display:block;font:800 1.6vw var(--head)}.hs .top .t small{font-size:1vw;color:var(--mut)}
.hs .top .right{margin-left:auto;display:flex;gap:1vw;align-items:center}
.hs .count{font:800 1.3vw var(--head);background:var(--card);border:1px solid var(--line);padding:.6vw 1.2vw;border-radius:999px}
.hs main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;width:100%}
.qrbox{background:#fff;padding:1.3vw;border-radius:2vw;box-shadow:0 2vw 5vw rgba(0,0,0,.5)}.qrbox canvas{display:block;width:24vw;height:24vw}
.lobby h1{font-size:5.4vw;font-weight:900;letter-spacing:-.01em}
.lobby h1 span{color:var(--glow)}
.lobby .sub{font-size:1.7vw;color:var(--mut);margin:1vw 0 2vw}
.chips{display:flex;flex-wrap:wrap;gap:.6vw;max-height:16vw;overflow:hidden}
.chip{padding:.45vw 1vw;border-radius:999px;background:rgba(255,255,255,.12);font:700 1.15vw var(--body);animation:pop .4s ease}
.url{font:700 1.2vw var(--body);color:var(--mut);margin-top:1vw}
.round{width:100%;display:grid;grid-template-columns:1fr auto;gap:4vw;align-items:center}
.round .k{font:800 1.4vw var(--head);letter-spacing:.2em;color:var(--glow);text-transform:uppercase}
.round h2{font-size:5vw;font-weight:900;margin:.6vw 0}.round p{font-size:2vw;color:var(--mut);margin:0}
.ring{position:relative;width:22vw;height:22vw}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:900 7vw var(--head)}

.bar{height:2.2vw;border-radius:1.1vw;background:rgba(255,255,255,.12);overflow:hidden;margin-top:3vw}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--glow));transition:width .4s}
.barlbl{font:700 1.4vw var(--body);color:var(--mut);margin-top:.8vw}
.mech{display:flex;gap:1vw;margin-top:2.4vw}.mech span{padding:.8vw 1.4vw;border-radius:1vw;background:#fff;color:var(--ink);font:800 1.4vw var(--head);animation:floaty 2.4s ease-in-out infinite alternate}
.mech span:nth-child(2){animation-delay:.3s}.mech span:nth-child(3){animation-delay:.6s}.mech span:nth-child(4){animation-delay:.9s}
@keyframes floaty{to{transform:translateY(-.8vw) rotate(-2deg)}}
.res{width:100%;display:grid;grid-template-columns:1.1fr 1fr;gap:3vw;align-items:start}
.res h3{font-size:1.5vw;letter-spacing:.14em;text-transform:uppercase;color:var(--glow);margin-bottom:1.2vw}
.lb{display:flex;flex-direction:column;gap:.7vw}
.lbr{display:grid;grid-template-columns:3vw 1fr auto auto;gap:1.2vw;align-items:center;padding:.8vw 1.4vw;border-radius:1.2vw;background:var(--card);border:1px solid var(--line);font:700 1.6vw var(--body);animation:slidein .5s ease both}
.lbr .pos{font:900 1.8vw var(--head);color:var(--mut)}.lbr:nth-child(1) .pos{color:#F2C12E}.lbr:nth-child(2) .pos{color:#D7DEE8}.lbr:nth-child(3) .pos{color:#E09A62}
.lbr .pts{font:900 1.8vw var(--head)}.lbr .plus{font:800 1.2vw var(--head);color:var(--ok)}
@keyframes slidein{from{transform:translateX(-3vw);opacity:0}}
.sol{display:flex;flex-direction:column;gap:.7vw}.sol div{padding:.8vw 1.2vw;border-radius:1vw;background:rgba(255,255,255,.08);font:700 1.45vw var(--body)}
.sol .bin{font:800 1.2vw var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--glow);background:none;padding:.6vw 0 0}
.sol .two{display:grid;grid-template-columns:1fr auto 1fr;gap:1vw;align-items:center}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw;width:100%}
.pod{width:20vw;text-align:center;animation:rise 1s cubic-bezier(.2,.9,.3,1.2) both}

.pod .blk{border-radius:1.4vw 1.4vw 0 0;display:grid;place-items:start center;padding-top:1.4vw;font:900 6vw var(--head);color:var(--ink)}

.pod.p1{animation-delay:1.6s}.pod.p2{animation-delay:.9s}.pod.p3{animation-delay:.3s}

.opts{display:flex;flex-direction:column;gap:10px}

.hbars{display:flex;flex-direction:column;gap:.75vw;width:100%}
.hb{display:grid;grid-template-columns:3vw 26vw 1fr 6vw;gap:1vw;align-items:center;font:700 1.45vw var(--body);animation:slidein .5s ease both}

.win{display:grid;grid-template-columns:1.15fr 1fr;gap:3vw;width:100%;align-items:start}

.win .idx{display:flex;align-items:baseline;gap:1vw;margin-top:2vw}.win .idx b{font:900 8vw var(--head);color:#FF6B78;line-height:1}.win .idx span{font:700 1.5vw var(--body);color:var(--mut)}

.win h3{font-size:1.4vw;letter-spacing:.14em;text-transform:uppercase;color:var(--glow);margin:0 0 1vw}
.prob{display:flex;flex-direction:column;gap:.7vw;margin-bottom:2.2vw}.prob div{display:grid;grid-template-columns:1fr auto;gap:1vw;padding:.9vw 1.3vw;border-radius:1vw;background:rgba(255,255,255,.08);font:700 1.45vw var(--body)}.prob div b{color:#FF8A8F}
.tram{display:flex;flex-wrap:wrap;gap:.6vw}.tram span{padding:.6vw 1.1vw;border-radius:999px;background:#fff;color:var(--ink);font:700 1.2vw var(--body)}
.lobchips .chip b{color:var(--glow);margin-left:.4vw}
</style>

			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}

	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}

	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}

		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}

	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;

					if (this.modules[row][col - c] === null) {

						}
					}

					row -= inc;
					inc = -inc;
					break;
				}
			}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

    }
    bind();
  }
  function exportXl() {
    const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const rows = rs.filter(r => Array.isArray(r.r)).sort((a, b) => norm(a.inst).localeCompare(norm(b.inst)));
    const csv = "﻿" + [["Coordinación", "Institución / dirección", "Participante", "Índice (0-100)", ...Q.map((x, i) => `P${i + 1} ${x.c}`), "Trámite con más problemas"].map(q).join(";"),
      ...rows.map(r => [r.coord, r.inst, r.nombre, r.idx, ...r.r.map((v, i) => Q[i].o[v]), r.tramite].map(q).join(";")),
      "", ["Ranking", "Institución", "Coordinación", "Índice", "Respuestas"].map(q).join(";"),
      ...ranking(rows).map((g, i) => [i + 1, g.inst, g.coord, g.idx, g.n].map(q).join(";"))].join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = `Diagnostico de tramites ${new Date().toLocaleDateString("en-CA")}.csv`; document.body.appendChild(a); a.click(); a.remove();
  }
  function askReset() {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="glass"><h2>¿Borrar todas las respuestas?</h2><p style="color:var(--mut);font-size:1.3vw">Las respuestas se acumulan entre talleres. Descarga el Excel antes si quieres guardarlas.</p><div style="display:flex;gap:1vw;justify-content:center;margin-top:1.4vw"><button class="btn" id="mY">Sí, borrar</button><button class="btn ghost" id="mN">Cancelar</button></div></div>`;
    document.body.appendChild(m); m.querySelector("#mN").onclick = () => m.remove(); m.querySelector("#mY").onclick = async () => { m.remove(); await DB.reset(); };
  }
  const next = () => DB.setState({ fase: !st || st.fase === "abierta" ? "resultados" : st.fase === "resultados" ? "ganador" : "abierta" });
  const fs = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); };
  function bind() { const b = id => document.getElementById(id); b("bNext").onclick = next; b("bXl").onclick = exportXl; b("bFs").onclick = fs; b("bReset").onclick = askReset; }
  addEventListener("keydown", e => {
    if (document.querySelector(".modal")) return;
    if (e.code === "Space" || e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); next(); }
    else if (e.key === "e" || e.key === "E") exportXl(); else if (e.key === "r" || e.key === "R") askReset(); else if (e.key === "f" || e.key === "F") fs();
  });
  let idleT; const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2600); }; addEventListener("mousemove", wake); wake();
  DB.watchAll(a => { const before = rs.filter(r => Array.isArray(r.r)).length; rs = a; const after = rs.filter(r => Array.isArray(r.r)).length; if (after > before && st && st.fase === "abierta" && before) sfx("whoosh1", .5); render(); });
  DB.watchState(s => {
    if (!s) { DB.setState({ fase: "abierta", partida: String(Date.now()) }); return; }
    const ch = !st || st.fase !== s.fase; st = s;
    if (ch && s.fase === "resultados") sfx("tadan");
    if (ch && s.fase === "ganador") { sfx("tadan_largo"); setTimeout(confetti, 600); }
    render();
  });
}
function confetti() {
  const cv = document.getElementById("cf"), x = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#19C3E6", "#F2C12E", "#2F80ED", "#D62839", "#2BB673", "#fff"], ps = Array.from({ length: 200 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6.3, s: 6 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0; (function f() { x.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (++t < 380) requestAnimationFrame(f); else x.clearRect(0, 0, cv.width, cv.height); })();
}

/* =====================================================================
   CELULAR
   ===================================================================== */
async function phone() {
  let uid = await DB.anon();
  const head = `<header><img src="logo/mara-bandera.svg" alt=""><div><b>Diagnóstico de trámites</b><small>Generación Genial · Mara Digital en Acción</small></div></header>`;
  const screen = inner => { app.innerHTML = `<div class="ph">${head}${inner}</div>`; scrollTo(0, 0); };
  const A = { nombre: "", coord: "", inst: "", r: [], tramite: "" };

  function done(again) {
    screen(`<div class="big"><div class="done">¡Gracias!</div><p>${again ? "Este teléfono ya respondió." : "Tu respuesta ya suma al diagnóstico."} Mira la pantalla para ver los resultados.</p>
      <button class="btn ghost" id="other">Responder por otra persona en este teléfono</button></div>`);
    document.getElementById("other").onclick = async () => { uid = await DB.newIdentity(); Object.assign(A, { nombre: "", coord: "", inst: "", r: [], tramite: "" }); intro(); };
  }
  function intro() {
    screen(`<div class="big" style="justify-content:flex-start;padding-top:8px"><span class="pill">12 preguntas · 3 minutos</span><h2>¿Cómo están los trámites donde trabajas?</h2>
      <p>Responde con sinceridad sobre la institución o dirección donde trabajas. Con estas respuestas se escoge la institución que recibirá la aplicación del proyecto «Mara Digital en Acción».</p>
      <form id="f0" style="width:100%;display:flex;flex-direction:column;gap:10px;text-align:left">
        <label for="nm">Tu nombre (opcional)</label><input id="nm" maxlength="24" autocomplete="off" placeholder="Puedes dejarlo en blanco" value="${esc(A.nombre)}">
        <button class="btn" type="submit" style="margin-top:8px">Empezar</button></form></div>`);
    document.getElementById("f0").onsubmit = e => { e.preventDefault(); A.nombre = document.getElementById("nm").value.replace(/\s+/g, " ").trim().slice(0, 24); where(); };
  }
  function where() {
    const coords = Object.keys(DIRS);
    screen(`<div class="rtitle"><h2>¿Dónde trabajas?</h2><p>Escoge tu coordinación y tu dirección o ente.</p></div>
      <label for="co">Coordinación</label><select id="co"><option value="">Escoge…</option>${coords.map(c => `<option ${c === A.coord ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <label for="di">Dirección o ente</label><select id="di" disabled><option value="">Primero la coordinación</option></select>
      <input id="ot" maxlength="80" placeholder="Escribe el nombre de tu dirección o ente" class="hidden">
      <div class="acts"><button class="btn ghost" id="bk">Atrás</button><button class="btn" id="go">Seguir</button></div><p class="prog" id="msg"></p>`);
    const co = document.getElementById("co"), di = document.getElementById("di"), ot = document.getElementById("ot");
    const fill = () => { const L = DIRS[co.value] || []; di.disabled = !co.value; di.innerHTML = `<option value="">Escoge…</option>` + L.map(d => `<option ${d === A.inst ? "selected" : ""}>${esc(d)}</option>`).join("") + `<option value="__otra">Otra (escribirla)</option>`; ot.classList.toggle("hidden", di.value !== "__otra"); };
    co.onchange = fill; di.onchange = () => { ot.classList.toggle("hidden", di.value !== "__otra"); if (di.value === "__otra") ot.focus(); }; if (A.coord) fill();
    document.getElementById("bk").onclick = intro;
    document.getElementById("go").onclick = () => {
      const inst = di.value === "__otra" ? ot.value.replace(/\s+/g, " ").trim() : di.value;
      if (!co.value || inst.length < 3) { document.getElementById("msg").textContent = "Escoge tu coordinación y tu dirección."; return; }
      A.coord = co.value; A.inst = inst; ask(0);
    };
  }
  function ask(i) {
    const q = Q[i];
    screen(`<div class="rhead"><b>Pregunta ${i + 1} de ${Q.length}</b><b style="color:var(--mut)">${esc(A.inst)}</b></div><div class="timer"><i style="transform:scaleX(${i / Q.length});transition:none"></i></div>
      <div class="qt">${esc(q.t)}</div><div class="opts">${q.o.map((o, k) => `<button class="opt${A.r[i] === k ? " sel" : ""}" data-k="${k}"><i></i>${esc(o)}</button>`).join("")}</div>
      <div class="acts"><button class="btn ghost" id="bk">Atrás</button></div>`);
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => { A.r[i] = +b.dataset.k; b.classList.add("sel"); setTimeout(() => i + 1 < Q.length ? ask(i + 1) : last(), 220); });
    document.getElementById("bk").onclick = () => i ? ask(i - 1) : where();
  }
  function last() {
    screen(`<div class="rtitle"><h2>Último paso</h2><p>¿Cuál es el trámite que más problemas da en tu institución?</p></div>
      <textarea id="tr" maxlength="80" placeholder="Ej.: solvencia municipal, permiso de construcción, constancia de residencia…">${esc(A.tramite)}</textarea>
      <div class="acts"><button class="btn ghost" id="bk">Atrás</button><button class="btn" id="go">Enviar</button></div><p class="prog" id="msg"></p>`);
    document.getElementById("bk").onclick = () => ask(Q.length - 1);
    document.getElementById("go").onclick = async e => {
      const t = document.getElementById("tr").value.replace(/\s+/g, " ").trim().slice(0, 80);
      if (t.length < 3) { document.getElementById("msg").textContent = "Escribe el nombre del trámite."; return; }
      A.tramite = t; e.target.disabled = true;
      const idx = Math.round(A.r.reduce((x, v) => x + v, 0) / MAX * 100);
      try { await DB.send(uid, A.nombre || "Participante", { coord: A.coord, inst: A.inst, r: A.r.slice(0, Q.length), idx, tramite: A.tramite }); done(false); }
      catch (err) { console.error(err); document.getElementById("msg").textContent = "No se pudo enviar. Revisa el internet e intenta de nuevo."; e.target.disabled = false; }
    };
  }
  let mine = null; try { mine = await DB.getMine(uid); } catch (e) {}
  mine && Array.isArray(mine.r) ? done(true) : intro();
}

IS_HOST ? host() : phone();
</script>

=====================================================================
  TRIVIA DEL BLOQUE HISTÓRICO — TODO EN ESTE ARCHIVO
  · Proyector (laptop):  tu-sitio/?pantalla   · Participantes: tu-sitio/ (el QR)
  · Configuración: sección 1 · Preguntas: sección 2
  · Sin configuración de Firebase funciona en MODO DEMO (solo esta computadora).

  EN LA LAPTOP DEL PROYECTOR
   · Los botones están ocultos: mueve el mouse para verlos (desaparecen solos).
   · Espacio: comenzar → (3, 2, 1) → la gente responde.
   · Espacio mientras responden: cierra la pregunta para todos y muestra los porcentajes
     (si no lo presionas, se cierra sola al acabar el tiempo).
   · Espacio otra vez: siguiente pregunta. R: ranking por generación · F: pantalla completa.
   · Cada partida usa 10 preguntas al azar (más la de práctica). "Reiniciar" sortea otras 10
     sin repetir las anteriores mientras queden preguntas nuevas.
   · Salas separadas: agrega ?sala=nombre al enlace, por ejemplo
       tu-sitio/?pantalla&sala=grupo2   (el QR ya lleva a esa misma sala)

  PASOS EN FIREBASE (una vez)
   1. Authentication → Sign-in method: activa "Anónimo" y "Correo/contraseña".
   2. Authentication → Users: crea el usuario del presentador.
   3. Firestore Database: créala y en "Reglas" pega las REGLAS de abajo,
      cambiando presentador@tucorreo.com por el correo del paso 2.
   4. Publica este archivo como index.html (Firebase Hosting, Netlify, GitHub Pages…).
      Si no usas un dominio .web.app, agrégalo en Authentication → Settings → Authorized domains.

  REGLAS DE FIRESTORE (copiar desde rules_version hasta la última llave)
=====================================================================
rules_version = '2';

// Reglas de seguridad de la Trivia del Bloque Histórico.
// CAMBIA el correo de abajo por el correo del presentador (el mismo que creas en Authentication).
service cloud.firestore {
  match /databases/{database}/documents {

    function esPresentador() {
      return request.auth != null
        && request.auth.token.email in ['presentador@tucorreo.com'];
    }
    function conectado() {
      return request.auth != null;
    }

    match /trivia/{sala} {
      // Estado de la partida (pregunta actual, fase, respuesta correcta al revelar)
      allow read: if conectado();
      allow write: if esPresentador();

      // Participantes: cada quien crea su propio registro con 0 puntos; solo el presentador suma puntos
      match /jugadores/{uid} {
        allow read: if conectado();
        allow create: if conectado() && request.auth.uid == uid
          && request.resource.data.keys().hasOnly(['nombre', 'gen', 'puntos', 'aciertos', 'creado'])
          && request.resource.data.gen is int
          && request.resource.data.gen >= 0
          && request.resource.data.gen <= 4
          && request.resource.data.nombre is string
          && request.resource.data.nombre.size() > 0
          && request.resource.data.nombre.size() <= 24
          && request.resource.data.puntos == 0
          && request.resource.data.aciertos == 0;
        allow update, delete: if esPresentador();
      }

      // Votos: uno por persona por pregunta, solo mientras la pregunta está abierta, sin poder cambiarlo
      match /votos/{votoId} {
        allow read: if esPresentador()
          || (conectado() && resource.data.uid == request.auth.uid);
        allow create: if conectado()
          && request.resource.data.keys().hasOnly(['q', 'opcion', 'uid', 't'])
          && request.resource.data.uid == request.auth.uid
          && request.resource.data.q is int
          && votoId == string(request.resource.data.q) + '_' + request.auth.uid
          && request.resource.data.opcion is int
          && request.resource.data.opcion >= 0
          && request.resource.data.opcion < 4
          && request.resource.data.t == request.time
          && get(/databases/$(database)/documents/trivia/$(sala)).data.fase == 'votando'
          && get(/databases/$(database)/documents/trivia/$(sala)).data.q == request.resource.data.q;
        allow update: if false;
        allow delete: if esPresentador();
      }
    }
  }
}

function drawQR(canvas, text, px) {
  try {
    const L = window.QRCodeLib, q = new L.QRCode(-1, L.QRErrorCorrectLevel.M); q.addData(text); q.make();
    const n = q.getModuleCount(), quiet = 2, size = (n + quiet * 2) * px;
    canvas.width = size; canvas.height = size;
    const c = canvas.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, size, size); c.fillStyle = "#0A2346";
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) c.fillRect((col + quiet) * px, (r + quiet) * px, px, px);
  } catch (e) { console.warn("QR", e); }
}

/* stable per-question shuffle */
function shuffled(qi) {
  const p = BANK[qi], idx = p.opciones.map((_, i) => i);
  if (CFG.mezclarOpciones) {
    let s = (qi + 1) * 2654435761 >>> 0;
    const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  }
  return { texto: p.texto, opciones: idx.map(i => p.opciones[i]), correcta: idx.indexOf(p.correcta), dato: p.dato || "", practica: !!p.practica };
}

/* generation standings: average points per participant */
function genStandings(players) {
  return GENS.map((g, i) => {
    const ps = players.filter(p => p.gen === i);
    const sum = ps.reduce((a, p) => a + (p.puntos || 0), 0), hits = ps.reduce((a, p) => a + (p.aciertos || 0), 0);
    return { i, nombre: g.nombre, edades: g.edades, n: ps.length, avg: ps.length ? Math.round(sum / ps.length) : 0, hits };
  }).sort((a, b) => (b.n > 0) - (a.n > 0) || b.avg - a.avg || b.n - a.n);
}

/* =====================================================================
   DATA LAYER — Firebase (event) or Demo (this computer only)
   ===================================================================== */
async function firebaseStore() {
  const V = "10.12.2";
  const [A, U, F] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const fb = A.initializeApp(CFG.firebase, IS_HOST ? "presentador" : "participante");
  const auth = U.getAuth(fb), db = F.initializeFirestore(fb, { experimentalAutoDetectLongPolling: true });
  const sala = F.doc(db, "trivia", CFG.sala), votos = F.collection(sala, "votos"), jug = F.collection(sala, "jugadores");
  const ms = t => (t && t.toMillis) ? t.toMillis() : (typeof t === "number" ? t : null);
  const ready = new Promise(r => { const off = U.onAuthStateChanged(auth, () => { off(); r(); }); });
  const onErr = e => { console.error(e); showBanner("Sin conexión con la base de datos (" + (e.code || e.message) + ")."); };
  const vmap = d => { const v = d.data({ serverTimestamps: "estimate" }); return { uid: v.uid, opcion: v.opcion, t: ms(v.t) || Date.now() }; };
  return {
    mode: "firebase",
    async ready() { await ready; return auth.currentUser; },
    async anon() { await ready; if (!auth.currentUser) await U.signInAnonymously(auth); return auth.currentUser.uid; },
    async hostLogin(email, pass) { await U.signInWithEmailAndPassword(auth, email, pass); return auth.currentUser; },
    async logout() { await U.signOut(auth); },
    isHostUser() { const u = auth.currentUser; return !!(u && !u.isAnonymous); },
    watchState(cb) { return F.onSnapshot(sala, s => { if (!s.exists()) return cb(null); const d = s.data({ serverTimestamps: "estimate" }); cb({ ...d, abiertaEn: ms(d.abiertaEn) }); }, onErr); },
    async setState(patch, openNow) { const p = { ...patch }; if (openNow) p.abiertaEn = F.serverTimestamp(); await F.setDoc(sala, p, { merge: true }); },
    async fetchState() { const s = await F.getDocFromServer(sala); if (!s.exists()) return null; const d = s.data({ serverTimestamps: "estimate" }); return { ...d, abiertaEn: ms(d.abiertaEn) }; },
    async join(uid, nombre, gen) { await F.setDoc(F.doc(jug, uid), { nombre, gen, puntos: 0, aciertos: 0, creado: F.serverTimestamp() }); },
    watchPlayer(uid, cb) { return F.onSnapshot(F.doc(jug, uid), s => cb(s.exists() ? s.data() : null), onErr); },
    watchPlayers(cb) { return F.onSnapshot(jug, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), onErr); },
    async vote(uid, q, opcion) { await F.setDoc(F.doc(votos, q + "_" + uid), { q, opcion, uid, t: F.serverTimestamp() }); },
    async myVote(uid, q) { try { const s = await F.getDoc(F.doc(votos, q + "_" + uid)); return s.exists() ? s.data().opcion : null; } catch { return null; } },
    watchVotes(q, cb) { return F.onSnapshot(F.query(votos, F.where("q", "==", q)), s => cb(s.docs.map(vmap)), onErr); },
    async getVotes(q) { const s = await F.getDocs(F.query(votos, F.where("q", "==", q))); return s.docs.map(vmap); },
    async award(list) {
      for (let i = 0; i < list.length; i += 400) {
        const b = F.writeBatch(db);
        for (const a of list.slice(i, i + 400)) b.update(F.doc(jug, a.uid), { puntos: F.increment(a.pts), aciertos: F.increment(1) });
        await b.commit();
      }
    },
    async reset(next) {
      for (const col of [votos, jug]) {
        const s = await F.getDocs(col);
        for (let i = 0; i < s.docs.length; i += 400) { const b = F.writeBatch(db); s.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
      }
      await F.setDoc(sala, next);
    },
  };
}

function demoStore() {
  const KEY = "trivia_demo2_" + CFG.sala;
  const bc = "BroadcastChannel" in window ? new BroadcastChannel(KEY) : null;
  const blank = () => ({ state: null, players: {}, votes: {} });
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || blank(); } catch { return blank(); } };
  let mem = load(); const subs = new Set();
  const notify = () => subs.forEach(f => f());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch {} if (bc) bc.postMessage(1); notify(); };
  const refresh = () => { mem = load(); notify(); };
  addEventListener("storage", e => { if (e.key === KEY) refresh(); });
  if (bc) bc.onmessage = refresh;
  const sub = f => { subs.add(f); queueMicrotask(f); return () => subs.delete(f); };
  let uid; try { uid = sessionStorage.getItem("trivia_demo_uid"); } catch {}
  if (!uid) { uid = "u" + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem("trivia_demo_uid", uid); } catch {} }
  const votesOf = q => Object.values(mem.votes).filter(v => v.q === q);
  const deny = m => Object.assign(new Error(m), { code: "permission-denied" });
  return {
    mode: "demo",
    async ready() { return null; }, async anon() { return uid; }, async hostLogin() { return {}; }, async logout() {}, isHostUser() { return true; },
    watchState(cb) { return sub(() => cb(mem.state)); },
    async setState(patch, openNow) { mem.state = { ...(mem.state || {}), ...patch }; if (openNow) mem.state.abiertaEn = Date.now(); save(); },
    async join(id, nombre, gen) { mem.players[id] = { nombre, gen, puntos: 0, aciertos: 0 }; save(); },
    watchPlayer(id, cb) { return sub(() => cb(mem.players[id] || null)); },
    watchPlayers(cb) { return sub(() => cb(Object.entries(mem.players).map(([id, p]) => ({ id, ...p })))); },
    async vote(id, q, opcion) {
      const k = q + "_" + id;
      if (mem.votes[k]) throw deny("ya votaste");
      if (!mem.state || mem.state.fase !== "votando" || mem.state.q !== q) throw deny("cerrada");
      mem.votes[k] = { q, opcion, uid: id, t: Date.now() }; save();
    },
    async myVote(id, q) { const v = mem.votes[q + "_" + id]; return v ? v.opcion : null; },
    watchVotes(q, cb) { return sub(() => cb(votesOf(q))); },
    async getVotes(q) { mem = load(); return votesOf(q); },
    async award(list) { for (const a of list) if (mem.players[a.uid]) { mem.players[a.uid].puntos += a.pts; mem.players[a.uid].aciertos += 1; } save(); },
    async reset(next) { mem = blank(); mem.state = next; save(); },
    async fetchState() { mem = load(); return mem.state; },
  };
}

/* ---------- animated background: slow waves in the colors of the Mara flag ---------- */
function startWaves(cv, still) {
  const ctx = cv.getContext("2d");
  const bands = [
    { c: "30,158,79", a: .30, y: .70, amp: .055, len: 1.05, sp: .00018, ph: 0 },
    { c: "255,255,255", a: .13, y: .78, amp: .045, len: 1.35, sp: -.00013, ph: 2 },
    { c: "42,100,180", a: .38, y: .86, amp: .05, len: .85, sp: .00022, ph: 4 },
    { c: "244,194,13", a: .10, y: .10, amp: .04, len: 1.6, sp: -.0001, ph: 1, top: true },
  ];
  let W = 0, H = 0, last = 0;
  const size = () => { W = cv.width = Math.round(innerWidth / 2); H = cv.height = Math.round(innerHeight / 2); };
  size(); addEventListener("resize", size);
  function frame(t) {
    if (t - last > 33 || still) {
      last = t; ctx.clearRect(0, 0, W, H);
      for (const b of bands) {
        ctx.beginPath();
        const base = H * b.y;
        for (let x = 0; x <= W; x += 6) {
          const y = base + Math.sin(x / (W * b.len) * Math.PI * 2 + t * b.sp * 6 + b.ph) * H * b.amp + Math.sin(x / (W * b.len * .37) + t * b.sp * 9) * H * b.amp * .35;
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        if (b.top) { ctx.lineTo(W, 0); ctx.lineTo(0, 0); } else { ctx.lineTo(W, H); ctx.lineTo(0, H); }
        ctx.closePath(); ctx.fillStyle = `rgba(${b.c},${b.a})`; ctx.fill();
      }
    }
    if (!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- confetti in the Alcaldía colors ---------- */
function makeConfetti(cv) {
  const ctx = cv.getContext("2d"), colors = ["#1E9E4F", "#FFFFFF", "#2A64B4", "#F4C20D", "#D7263D"];
  let parts = [], running = false;
  const size = () => { cv.width = innerWidth; cv.height = innerHeight; };
  size(); addEventListener("resize", size);
  function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < cv.height + 40 && p.life > 0);
    for (const p of parts) {
      p.vy += .18; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.r * 2.2));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (parts.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  const fire = kind => {
    if (kind === "clear") { parts = []; ctx.clearRect(0, 0, cv.width, cv.height); return; }
    const W = cv.width, H = cv.height, n = kind === "podium" ? 320 : 140;
    for (let i = 0; i < n; i++) {
      const fromLeft = i % 2 === 0, podium = kind === "podium";
      parts.push({
        x: podium ? W / 2 + (Math.random() - .5) * W * .25 : (fromLeft ? -10 : W + 10),
        y: podium ? H * .55 : H * (.55 + Math.random() * .25),
        vx: podium ? (Math.random() - .5) * 16 : (fromLeft ? 1 : -1) * (6 + Math.random() * 9),
        vy: podium ? -(10 + Math.random() * 12) : -(8 + Math.random() * 10),
        w: 8 + Math.random() * 8, h: 12 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
        c: colors[i % colors.length], life: 260,
      });
    }
    if (!running) { running = true; requestAnimationFrame(loop); }
  };
  return fire;
}

/* =====================================================================
   PHONE (participants)
   ===================================================================== */
async function participant(store) {
  let uid;
  try { uid = await store.anon(); }
  catch (e) { return mount(h("div", { class: "center" }, h("div", { class: "card" }, h("h2", {}, "No se pudo conectar"), h("p", { class: "muted" }, "Revisa tu conexión a internet y vuelve a abrir el enlace."), h("p", { class: "note" }, e.code || e.message)))); }
  const S = { uid, me: undefined, state: null, players: [], myVotes: {}, sending: false, joining: false, err: "", viewKey: "", gen: null, name: "", prepKey: null, prepStart: 0, lastPrep: null, openAt: {}, timeUp: {} };
  const vk = (st, q) => `trivia_v2_${CFG.sala}_${st.partida}_${uid}_${q}`;
  const remember = (st, q, o) => { S.myVotes[vk(st, q)] = o; try { localStorage.setItem(vk(st, q), o); } catch {} };
  const forget = (st, q) => { delete S.myVotes[vk(st, q)]; try { localStorage.removeItem(vk(st, q)); } catch {} };

    if (st && st.fase === "preparando" && S.prepKey !== `${st.partida}-${st.q}`) { S.prepKey = `${st.partida}-${st.q}`; S.prepStart = Date.now() + 600; S.lastPrep = null; }
    if (st && st.fase !== "votando") S.err = "";
    if (st && S.me && prev && (prev.q !== st.q || prev.fase !== st.fase)) {
      if (st.fase === "votando") vibrate(180);
      else if (st.fase === "cerrada" && !(BANK[st.q] && BANK[st.q].practica)) vibrate(recall(st, st.q) === st.correcta ? [70, 60, 70] : 320);
    }
    update();                                  // draw the new question right away
    if (st && st.q >= 0 && recall(st, st.q) === undefined)   // then check (in the background) if this phone already answered it
      store.myVote(uid, st.q).then(v => { if (v !== null && v !== undefined && S.state === st) { remember(st, st.q, v); update(); } });
  };
  store.watchState(onState);
  /* if the phone slept, lost signal or the live connection stalled, read the latest state from the server */
  let resyncing = false;
  const resync = async () => { if (resyncing) return; resyncing = true; try { const st = await store.fetchState(); if (st && (!S.state || st.partida !== S.state.partida || st.fase !== S.state.fase || st.q !== S.state.q)) onState(st); } catch {} resyncing = false; };

  setInterval(() => {                          // watchdog: a question that should already be over means this phone fell behind

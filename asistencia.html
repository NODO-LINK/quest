<!--
  CONTROL DE ASISTENCIA DE LOS FORMADOS — Alcaldía Bolivariana de Mara
  · Formados: escanean el QR de la sesión (asistencia.html?s=CÓDIGO), ponen su cédula y marcan.
    La primera vez se registran (nombre, edad → generación, coordinación).
  · Administración: asistencia.html?admin (correo y contraseña de presentador, los mismos de la trivia).
    Sesiones (crear, abrir/cerrar, proyectar QR), Formados (constancia), Panel (gráficos), Repetidos, Ajustes.
  · Prueba sin internet: asistencia.html?demo&admin y asistencia.html?demo&s=CÓDIGO en la misma computadora.
  · Privacidad: la cédula solo la ve la administración; el teléfono del formado solo consulta una huella (hash) de su cédula.

		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

    const v = $('#view'); if (!v) return;
    const keepFocus = document.activeElement && document.activeElement.id;
    if (S.tab === 'sesiones') v.innerHTML = viewSesiones();
    if (S.tab === 'formados') v.innerHTML = viewFormados();
    if (S.tab === 'panel') v.innerHTML = viewPanel();
    if (S.tab === 'repetidos') v.innerHTML = viewRepetidos();
    if (S.tab === 'ajustes') v.innerHTML = viewAjustes();
    bind();
    if (keepFocus && document.getElementById(keepFocus) && keepFocus === 'q') { const el = document.getElementById('q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  const sesionesOrden = () => Object.entries(S.ses).sort((a, b) => (b[1].fecha || '').localeCompare(a[1].fecha || '') || tsMs(b[1].creada) - tsMs(a[1].creada));

  function sesItems() {
    const { bySes } = stats();
    return sesionesOrden().map(([id, s]) => `<div class="item">
      <div class="t"><b>${esc(s.modulo)}</b><span>${esc(fmtFecha(s.fecha))} · ${esc(s.coordinacion || '')}${s.lugar ? ' · ' + esc(s.lugar) : ''}</span></div>
      <span class="badge ${s.abierta ? 'b-open' : 'b-closed'}">${s.abierta ? 'Abierta' : 'Cerrada'}</span>
      <b class="num" style="min-width:90px">${(bySes[id] || []).length} asistentes</b>
      <div class="row"><button class="btn sm blue" data-proj="${id}">📽 Proyectar QR</button><button class="btn sm" data-toggle="${id}">${s.abierta ? 'Cerrar' : 'Abrir'}</button><button class="btn sm" data-copy="${id}">Copiar enlace</button></div></div>`).join('') || '<p class="muted">Aún no hay sesiones. Crea la primera.</p>';
  }
  function viewSesiones() {
    const coordOpts = S.cfg.coordinaciones.map(c => `<option>${esc(c)}</option>`).join('');
    return `<div class="grid2" style="margin-top:14px;grid-template-columns:minmax(260px,380px) 1fr">
      <form class="glass pad" id="nf"><h2>Nueva sesión</h2>
        <label for="nfF">Fecha</label><input id="nfF" type="date" value="${today()}" required>
        <label for="nfM">Formación</label>
        <div class="mwrap" id="mw"><input id="nfM" placeholder="Toca para elegir la formación" required maxlength="160" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="mp" value="${esc(formFull(FORMACIONES[0]))}">
          <span class="caret" aria-hidden="true">▾</span><div class="mpanel" id="mp" role="listbox" hidden></div></div>
        <label for="nfC">Coordinación</label><select id="nfC" required>${coordOpts}</select>
        <label for="nfL">Lugar (opcional)</label><input id="nfL" maxlength="80" placeholder="Ej.: Salón de sesiones">
        <button class="btn primary" type="submit">Crear y abrir</button></form>
      <section class="glass pad"><h2>Sesiones</h2><div class="list" id="sesList">${sesItems()}</div></section></div>`;
  }
  function viewFormados() {
    const { byPer } = stats(), C = S.cfg.culminar || 5, q = normName(S.q), qd = S.q.replace(/\D/g, '');
    const rows = Object.entries(S.per).map(([h, p]) => ({ h, p, n: (byPer[h] || []).length, last: Math.max(0, ...(byPer[h] || []).map(m => tsMs(m.t))) }))
      .filter(r => !q && !qd || (q && normName(r.p.nombre).includes(q)) || (qd && String(r.p.cedula).includes(qd)))
      .sort((a, b) => normName(a.p.nombre).localeCompare(normName(b.p.nombre)));
    const tr = rows.map(r => { const g = GENS[r.p.gen] || {}; const ok = r.n >= C;
      return `<tr data-per="${r.h}"><td><b>${esc(r.p.nombre)}</b></td><td class="num">${esc(r.p.cedula)}</td><td>${esc(r.p.coord)}</td><td><span class="dot" style="background:${g.c || '#999'}"></span>${esc(g.n || '—')}</td>
        <td class="num"><b>${r.n}</b> / ${C}</td><td>${ok ? '<span class="badge b-done">Culminó ✓</span>' : `<span class="badge b-closed">Le faltan ${C - r.n}</span>`}</td></tr>`; }).join('');
    return `<section class="glass pad" style="margin-top:14px">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">Formados (${Object.keys(S.per).length})</h2>
      <input id="q" style="max-width:340px" placeholder="Buscar por nombre o cédula" value="${esc(S.q)}"></div>
      <p class="muted" style="font-size:14px">Constancia: asistencias de cada persona. Culmina con ${C} asistencias (lo cambias en Ajustes). Toca una fila para ver sus sesiones.</p>
      <div class="tablewrap"><table><thead><tr><th>Nombre</th><th class="num">Cédula</th><th>Coordinación</th><th>Generación</th><th class="num">Asistencias</th><th>Estado</th></tr></thead>
      <tbody>${tr || '<tr><td colspan="6" class="muted">Sin resultados.</td></tr>'}</tbody></table></div>
      <div id="det">${S.det ? detalle(S.det) : ''}</div></section>`;
  }
  function detalle(h) {
    const p = S.per[h]; if (!p) return '';
    const ms = Object.values(S.mar).filter(m => m.persona === h).sort((a, b) => tsMs(a.t) - tsMs(b.t));
    return `<div class="glass pad" style="margin-top:14px"><h2>${esc(p.nombre)}</h2><p class="muted">C.I. ${esc(p.cedula)} · ${esc(p.coord)} · ${esc((GENS[p.gen] || {}).n || '')} · ${esc(p.edad)} años</p>
      <div class="list">${ms.map(m => { const s = S.ses[m.sesion] || {}; return `<div class="item"><div class="t"><b>${esc(s.modulo || 'Sesión eliminada')}</b><span>${esc(s.fecha ? fmtFecha(s.fecha) : '')} · marcó a las ${hora(tsMs(m.t))}</span></div></div>`; }).join('') || '<p class="muted">Sin asistencias.</p>'}</div></div>`;
  }
  function vbars(vals, labels, colors) {
    const max = Math.max(1, ...vals);
    return `<div class="vbars">${vals.map((v, i) => `<div class="vbar" title="${esc(labels[i])}: ${v}"><b>${v}</b><i style="height:${Math.max(2, v / max * 170)}px;background:${colors[i]};animation-delay:${i * 90}ms"></i></div>`).join('')}</div>
      <div class="vlabels">${labels.map(l => `<span title="${esc(l)}">${esc(l)}</span>`).join('')}</div>`;
  }
  function hbars(rows) {
    const max = Math.max(1, ...rows.map(r => r[1]));
    return `<div class="hbars">${rows.map(([l, v, c, suf], i) => `<div class="hbar" title="${esc(l)}: ${v}${suf || ''}"><span>${esc(l)}</span><div class="track"><div class="fill" style="width:${v / max * 100}%;background:${c || '#2F80ED'};animation-delay:${i * 90}ms"></div></div><b>${v}${suf || ''}</b></div>`).join('')}</div>`;
  }
  function viewPanel() {
    const { byPer, bySes } = stats(), C = S.cfg.culminar || 5;
    const per = Object.entries(S.per), formados = per.filter(([h]) => (byPer[h] || []).length > 0);
    const culm = per.filter(([h]) => (byPer[h] || []).length >= C).length;
    const byGen = GENS.map((g, i) => formados.filter(([, p]) => p.gen === i).length);
    const coords = [...new Set([...S.cfg.coordinaciones, ...per.map(([, p]) => p.coord)])];
    const byCoord = coords.map(c => [c, formados.filter(([, p]) => p.coord === c).length, '#2F80ED']).filter(r => r[1] > 0 || S.cfg.coordinaciones.includes(r[0]));
    const culmCoord = coords.map(c => { const all = per.filter(([, p]) => p.coord === c); const ok = all.filter(([h]) => (byPer[h] || []).length >= C).length; return [c, all.length ? Math.round(ok / all.length * 100) : 0, '#2BB673', '%']; }).filter(r => S.cfg.coordinaciones.includes(r[0]) || r[1] > 0);
    const ses = sesionesOrden().slice(0, 10).reverse();
    return `<div style="margin-top:14px;display:flex;flex-direction:column;gap:14px">
      <div class="kpis">
        <div class="glass kpi"><small>Formados registrados</small><b>${per.length}</b><span>${formados.length} con asistencia</span></div>
        <div class="glass kpi"><small>Asistencias marcadas</small><b>${Object.keys(S.mar).length}</b><span>en ${Object.keys(S.ses).length} sesiones</span></div>
        <div class="glass kpi"><small>Culminaron (${C}+ asistencias)</small><b>${culm}</b><span>${per.length ? Math.round(culm / per.length * 100) : 0}% de los registrados</span></div>
        <div class="glass kpi"><small>Promedio por sesión</small><b>${Object.keys(S.ses).length ? Math.round(Object.keys(S.mar).length / Object.keys(S.ses).length) : 0}</b><span>asistentes</span></div>
      </div>
      <div class="grid2">
        <section class="glass pad chart"><h3>Formados por generación</h3><p>Personas con al menos una asistencia</p>${vbars(byGen, GENS.map(g => g.n), GENS.map(g => g.c))}</section>
        <section class="glass pad chart"><h3>Formados por coordinación</h3><p>Personas con al menos una asistencia</p>${hbars(byCoord)}</section>
        <section class="glass pad chart"><h3>Culminación por coordinación</h3><p>% de registrados con ${C} o más asistencias</p>${hbars(culmCoord)}</section>
        <section class="glass pad chart"><h3>Asistentes por sesión</h3><p>Últimas ${ses.length} sesiones</p>${ses.length ? hbars(ses.map(([id, s]) => [`${s.fecha ? s.fecha.slice(8, 10) + '/' + s.fecha.slice(5, 7) : ''} · ${s.modulo}`, (bySes[id] || []).length, '#F2C12E'])) : '<p class="muted">Sin sesiones.</p>'}</section>
      </div></div>`;
  }
  function viewRepetidos() {
    // 1) one phone marking several people in the same session
    const dev = {};
    Object.values(S.mar).forEach(m => { const k = m.sesion + '|' + m.uid; (dev[k] = dev[k] || []).push(m); });
    const multi = Object.entries(dev).filter(([, ms]) => ms.length > 1);
    // 2) same name registered with different cédulas
    const byName = {};
    Object.entries(S.per).forEach(([h, p]) => { const k = normName(p.nombre); (byName[k] = byName[k] || []).push([h, p]); });
    const dupNames = Object.values(byName).filter(a => a.length > 1);
    const devHtml = multi.map(([k, ms]) => { const s = S.ses[ms[0].sesion] || {}; return `<div class="item"><div class="t"><b>${ms.length} personas desde un mismo teléfono</b><span>${esc(s.modulo || '')} · ${esc(s.fecha ? fmtFecha(s.fecha) : '')}</span></div>
      <div class="t">${ms.map(m => { const p = S.per[m.persona] || {}; return `<div>${esc(p.nombre || '¿?')} <span class="muted">· ${hora(tsMs(m.t))}</span> <button class="btn sm" data-delm="${esc(m.sesion + '_' + m.persona)}" title="Quitar esta asistencia">Quitar</button></div>`; }).join('')}</div></div>`; }).join('');
    const nameHtml = dupNames.map(a => `<div class="item"><div class="t"><b>${esc(a[0][1].nombre)}</b><span>Registrado ${a.length} veces con cédulas distintas: ${a.map(([, p]) => esc(p.cedula)).join(' · ')}</span></div><span class="badge b-warn">Revisar</span></div>`).join('');
    return `<div style="margin-top:14px;display:flex;flex-direction:column;gap:14px">
      <section class="glass pad"><h2>Mismo teléfono, varias personas</h2><p class="muted" style="font-size:14px">Puede ser alguien que no tiene teléfono y le prestaron uno, o alguien marcando por otro. Revisa y quita la asistencia si no estuvo.</p>
        <div class="list">${devHtml || '<p class="muted">Nada raro por ahora ✓</p>'}</div></section>
      <section class="glass pad"><h2>Mismo nombre, cédulas distintas</h2><p class="muted" style="font-size:14px">Posible error al escribir la cédula o registro doble.</p>
        <div class="list">${nameHtml || '<p class="muted">Nada raro por ahora ✓</p>'}</div></section>
      <section class="glass pad"><h2>Doble marca el mismo día</h2><p class="muted" style="margin:0">La app no deja que una misma cédula marque dos veces en la misma sesión: si lo intenta, le dice que ya estaba registrada.</p></section></div>`;
  }
  function viewAjustes() {
    return `<form class="glass pad" id="af" style="margin-top:14px;max-width:640px"><h2>Ajustes</h2>
      <label for="aC">Coordinaciones (una por línea)</label><textarea id="aC">${esc(S.cfg.coordinaciones.join('\n'))}</textarea>
      <label for="aN">Asistencias para culminar</label><input id="aN" type="number" min="1" max="60" value="${S.cfg.culminar || 5}">
      <button class="btn primary" type="submit">Guardar</button></form>`;
  }
  function bind() {
    const nf = $('#nf'); if (nf && !nf.dataset.b) nf.dataset.b = 1, nf.addEventListener('submit', async e => {
      e.preventDefault();
      const mod = $('#nfM').value.trim(), f = FORMACIONES.find(x => formFull(x) === mod);
      const id = newId(), data = { fecha: $('#nfF').value, modulo: mod, deck: f ? f.deck : '', coordinacion: $('#nfC').value, lugar: $('#nfL').value.trim(), abierta: true, creada: Date.now() };
      try { await DB.saveSesion(id, data); toast('Sesión creada y abierta'); openProj(id); } catch (err) { toast('No se pudo crear (¿reglas de Firestore?)'); }
    });
    const mi = $('#nfM'); if (mi && !mi.dataset.b) { mi.dataset.b = 1; modulePicker(mi); }
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => { const s = S.ses[b.dataset.toggle]; try { await DB.saveSesion(b.dataset.toggle, { abierta: !s.abierta }); } catch (e) { toast('No se pudo cambiar'); } });
    document.querySelectorAll('[data-proj]').forEach(b => b.onclick = () => openProj(b.dataset.proj));
    document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(linkOf(b.dataset.copy)); toast('Enlace copiado'); } catch (e) { prompt('Copia el enlace:', linkOf(b.dataset.copy)); } });
    const q = $('#q'); if (q && !q.dataset.b) q.dataset.b = 1, q.addEventListener('input', () => { S.q = q.value; render(); });
    document.querySelectorAll('[data-per]').forEach(r => r.onclick = () => { S.det = r.dataset.per; $('#det').innerHTML = detalle(S.det); $('#det').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    document.querySelectorAll('[data-delm]').forEach(b => b.onclick = async () => { if (!confirm('¿Quitar esta asistencia?')) return; try { await DB.deleteMarca(b.dataset.delm); toast('Asistencia quitada'); } catch (e) { toast('No se pudo quitar'); } });
    const af = $('#af'); if (af && !af.dataset.b) af.dataset.b = 1, af.addEventListener('submit', async e => {
      e.preventDefault();
      const c = { coordinaciones: $('#aC').value.split('\n').map(s => s.trim()).filter(Boolean), culminar: Math.max(1, +$('#aN').value || 5) };
      try { await DB.setConfig(c); S.cfg = c; toast('Ajustes guardados'); } catch (err) { toast('No se pudo guardar'); }
    });
  }
  // grouped, searchable module list in the Alcaldía style; free text still allowed
  function modulePicker(inp) {
    const wrap = $('#mw'), panel = $('#mp');
    const MODS = FORMACIONES.map((f, i) => ({ full: formFull(f), g: 'Formaciones', c: f.c, num: String(i + 1), title: f.t, sub: f.s }));
    let act = -1, shown = [];
    const draw = () => {
      const q = normName(inp.value);
      shown = MODS.filter(m => !q || normName(m.full).includes(q) || MODS.some(x => x.full === inp.value));
      let html = '', last = '';
      shown.forEach((m, i) => {
        if (m.g !== last) { html += `<div class="mgen"><i style="background:#F4C20D"></i>${esc(m.g)}</div>`; last = m.g; }
        html += `<button type="button" class="mopt${i === act ? ' act' : ''}" role="option" data-i="${i}"><b style="background:${m.c};color:#fff">🎓</b><span><strong style="display:block">${esc(m.title)}</strong><span class="muted" style="font-size:13.5px">${esc(m.sub)}</span></span></button>`;
      });
      panel.innerHTML = html || `<div class="mempty">Ninguna formación coincide. Puedes dejar lo que escribiste.</div>`;
      panel.querySelectorAll('.mopt').forEach(b => b.addEventListener('mousedown', e => { e.preventDefault(); pick(+b.dataset.i); }));
    };
    const open = () => { act = -1; draw(); panel.hidden = false; wrap.classList.add('open'); inp.setAttribute('aria-expanded', 'true'); };
    const close = () => { panel.hidden = true; wrap.classList.remove('open'); inp.setAttribute('aria-expanded', 'false'); };
    const pick = i => { const m = shown[i]; if (!m) return; inp.value = m.full; close(); };
    inp.addEventListener('focus', open); inp.addEventListener('click', open);
    inp.addEventListener('input', () => { act = -1; if (panel.hidden) open(); else draw(); });
    inp.addEventListener('blur', () => setTimeout(close, 120));
    inp.addEventListener('keydown', e => {
      if (panel.hidden && (e.key === 'ArrowDown')) { open(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = Math.max(0, Math.min(shown.length - 1, act + (e.key === 'ArrowDown' ? 1 : -1))); draw(); const el = panel.querySelector('.mopt.act'); el && el.scrollIntoView({ block: 'nearest' }); }
      else if (e.key === 'Enter' && !panel.hidden && act >= 0) { e.preventDefault(); pick(act); }
      else if (e.key === 'Escape') close();
    });
  }
  const linkOf = id => { const u = new URL(location.href); u.search = (DB.demo ? '?demo&' : '?') + 's=' + id; u.hash = ''; return u.toString(); };

  /* projector: big QR + live counter */
  let projId = null;
  function drawQR(canvas, text, px) {
    const L = window.QRCodeLib, q = new L.QRCode(-1, L.QRErrorCorrectLevel.M); q.addData(text); q.make();
    const n = q.getModuleCount(), quiet = 2, size = (n + quiet * 2) * px; canvas.width = size; canvas.height = size;
    const c = canvas.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, size, size); c.fillStyle = '#0A2346';
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) c.fillRect((col + quiet) * px, (r + quiet) * px, px, px);
  }
  function openProj(id) {
    projId = id; const s = S.ses[id] || {};
    let el = $('#proj'); if (!el) { el = document.createElement('div'); el.id = 'proj'; document.body.appendChild(el); }
    el.innerHTML = `<canvas id="qr" aria-label="Código QR de asistencia"></canvas>
      <div class="pt"><div class="eyebrow">Registro de asistencia · ${esc(fmtFecha(s.fecha))}</div><h1>${esc(s.modulo || '')}</h1>
      <p>${esc(s.coordinacion || '')}${s.lugar ? ' · ' + esc(s.lugar) : ''}</p>
      <p style="color:#fff;font-weight:700">Escanea el código con la cámara de tu teléfono y escribe tu cédula.</p>
      <div class="count"><span id="pc">0</span><small>ASISTENTES</small></div><div class="recent" id="pr"></div><p class="url">${esc(linkOf(id))}</p></div>
      <button class="btn x" id="px">✕ Cerrar</button>`;
    drawQR($('#qr'), linkOf(id), 12);
    $('#px').onclick = () => { el.remove(); projId = null; };
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    updateProj();
  }
  function updateProj() {
    if (!projId || !$('#pc')) return;
    const ms = Object.values(S.mar).filter(m => m.sesion === projId).sort((a, b) => tsMs(b.t) - tsMs(a.t));
    $('#pc').textContent = ms.length;
    $('#pr').innerHTML = ms.slice(0, 8).map(m => { const p = S.per[m.persona]; return p ? `<span>${esc(firstName(p.nombre))} ${esc((p.nombre.split(' ')[1] || '').slice(0, 1))}.</span>` : ''; }).join('');
  }

  if (ADMIN) admin(); else if (SID) participant();
  else root.innerHTML = `<div class="wrap"><header class="top">${brand('Registro de asistencia')}</header><div class="glass pad"><h2>Escanea el código QR</h2><p class="muted">Para marcar tu asistencia, escanea el código QR que proyecta el facilitador en la sesión.</p></div></div>`;
})();
</script>
</body>
</html>

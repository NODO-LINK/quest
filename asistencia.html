<!--
  CONTROL DE ASISTENCIA DE LOS FORMADOS — Alcaldía Bolivariana de Mara
  · Formados: escanean el QR de la sesión (asistencia.html?s=CÓDIGO), ponen su cédula y marcan.
    La primera vez se registran (nombre, edad → generación, coordinación).
  · Sesiones: botón «Imprimir listado» (alfabético, con columna de firma) y descarga a Excel.
  · Administración: asistencia.html?admin (correo y contraseña de presentador, los mismos de la trivia).
    Sesiones (crear, abrir/cerrar, proyectar QR), Formados (constancia), Panel (gráficos), Repetidos, Ajustes.
  · Prueba sin internet: asistencia.html?demo&admin y asistencia.html?demo&s=CÓDIGO en la misma computadora.
  · Privacidad: la cédula solo la ve la administración; el teléfono del formado solo consulta una huella (hash) de su cédula.
-->

						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

        <button class="btn" id="other" style="margin-top:20px">Marcar a otra persona</button></div>`;

      const sh = ['#D62839', '#1E9E4F', '#2F80ED', '#C8743A'][Math.floor(Math.random() * 4)];

        <p class="muted">Pasa al frente y baila. ¡Todos a aplaudir!</p>
        <button class="btn primary" id="yaBaile" style="margin-top:16px">¡Ya bailé!</button>
        <button class="btn" id="other" style="margin-top:10px;width:100%">Marcar a otra persona</button></div>`;
      const stop = beat();
      $('#yaBaile').onclick = () => { stop(); done(n, true); card.querySelector('h1').textContent = '¡Gracias por bailar!'; };
      $('#other').onclick = () => { stop(); stepCed(); };
    };
    stepCed();
  }

      $('#cced').focus();

        e.preventDefault(); const ced = $('#cced').value.replace(/\D/g, '');

        $('#cm').textContent = 'Buscando…';

        catch (err) { $('#cm').textContent = 'No se pudo consultar. Revisa el internet e intenta de nuevo.'; }
      });
    };
    const fmtCed = c => 'V-' + String(c).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const show = async (r, ced) => {
      const p = r.persona, C = (r.cfg && r.cfg.culminar) || 5;
      const ms = r.marcas.slice().sort((a, b) => tsMs(a.t) - tsMs(b.t));
      const fechas = ms.map(m => (r.sesiones[m.sesion] || {}).fecha).filter(Boolean);
      const mod = (ms.map(m => (r.sesiones[m.sesion] || {}).modulo).find(Boolean)) || formFull(FORMACIONES[0]);
      const g = GENS[p.gen] || { n: '' }, n = ms.length, ok = n >= C;
      shell(`<p class="muted" style="margin:0 0 12px">Generando tu constancia…</p>`);
      const url = await drawCert({ nombre: p.nombre, ced: fmtCed(ced), gen: g.n, coord: p.coord, mod, n, fechas, ok, C, code: (await hashCed(ced)).slice(0, 8).toUpperCase() });
      shell(`<img src="${url}" alt="Constancia de participación de ${esc(p.nombre)}" style="width:100%;border-radius:12px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.35)">
        <p class="muted" style="margin:12px 0 0;text-align:center">¡Gracias por participar!</p>
        <a class="btn primary" style="display:flex;align-items:center;justify-content:center;margin-top:14px;text-decoration:none" href="${url}" download="Constancia-${esc(firstName(p.nombre))}.png">Descargar imagen</a>
        <button class="btn" id="cpdf" style="width:100%;margin-top:10px">Guardar como PDF / imprimir</button>
        <button class="btn" id="cotra" style="width:100%;margin-top:10px">Ver otra cédula</button>`);
      $('#cpdf').onclick = () => { const w = window.open(''); if (!w) return; w.document.write(`<title>Constancia</title><style>@page{size:landscape;margin:0}body{margin:0}img{width:100%;display:block}</style><img src="${url}" onload="setTimeout(()=>print(),200)">`); w.document.close(); };
      $('#cotra').onclick = ask;
    };
    ask();
  }
  // the certificate is drawn on a canvas so it can be saved as an image (A4 landscape, 2000 x 1414)
  async function drawCert(d) {
    const W = 2000, H = 1414, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
    const logo = await img('logo/mara-logo.svg');
    x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
    const band = (y, h) => { [['#1E9E4F', 0], ['#F2C12E', 1], ['#2F80ED', 2], ['#D62839', 3]].forEach(([col, k]) => { x.fillStyle = col; x.fillRect(k * W / 4, y, W / 4, h); }); };
    band(0, 22); band(H - 22, 22);
    x.strokeStyle = '#C9A227'; x.lineWidth = 4; x.strokeRect(60, 70, W - 120, H - 140); x.lineWidth = 1.5; x.strokeRect(78, 88, W - 156, H - 176);
    if (logo) { const lw = 520, lh = lw * 228 / 488; x.drawImage(logo, (W - lw) / 2, 120, lw, lh); }
    const center = (t, y, font, col) => { x.font = font; x.fillStyle = col; x.textAlign = 'center'; x.fillText(t, W / 2, y); };
    const wrap = (t, y, font, col, maxW, lh) => { x.font = font; x.fillStyle = col; x.textAlign = 'center'; const words = String(t).split(' '); let line = '', yy = y; for (const w of words) { const test = line ? line + ' ' + w : w; if (x.measureText(test).width > maxW && line) { x.fillText(line, W / 2, yy); line = w; yy += lh; } else line = test; } if (line) x.fillText(line, W / 2, yy); return yy; };
    center('CONSTANCIA DE PARTICIPACIÓN', 470, '700 64px Georgia, "Times New Roman", serif', '#0B1426');
    center('Se hace constar que', 560, 'italic 34px Georgia, serif', '#445066');
    center(d.nombre.toUpperCase(), 655, '700 76px Georgia, serif', '#B21E30');
    x.fillStyle = '#C9A227'; x.fillRect(W / 2 - 360, 690, 720, 3);
    center(`C.I. ${d.ced}${d.gen ? '  ·  Generación ' + d.gen : ''}`, 750, '600 32px system-ui, sans-serif', '#0B1426');
    let y = wrap(d.coord ? 'Coordinación: ' + d.coord : '', 800, '400 30px system-ui, sans-serif', '#445066', 1500, 40);
    y = wrap(`participó en el ${d.mod}, con ${d.n} ${d.n === 1 ? 'asistencia' : 'asistencias'}${d.fechas.length ? ' (' + d.fechas.slice(0, 8).map(f => f.split('-').reverse().join('/')).join(', ') + (d.fechas.length > 8 ? '…' : '') + ')' : ''}.`, y + 70, '400 34px system-ui, sans-serif', '#0B1426', 1600, 48);
    const badge = `${d.n} ${d.n === 1 ? 'ASISTENCIA REGISTRADA' : 'ASISTENCIAS REGISTRADAS'}`;   // no required number: it changes per formation
    x.font = '800 30px system-ui, sans-serif'; const bw = x.measureText(badge).width + 80, by = Math.min(y + 70, 1110);
    x.fillStyle = '#1E9E4F'; x.beginPath(); x.roundRect((W - bw) / 2, by, bw, 66, 33); x.fill(); center(badge, by + 44, '800 30px system-ui, sans-serif', '#FFFFFF');
    const today = new Date().toLocaleDateString('es-VE', { day: 'numeric', month: 'long', year: 'numeric' });
    center(`Municipio Mara, ${today}`, 1240, '400 28px system-ui, sans-serif', '#445066');
    center('Dirección General  ·  Dirección de Planificación y Desarrollo', 1285, '600 26px system-ui, sans-serif', '#0B1426');
    x.textAlign = 'right'; x.font = '400 20px system-ui, sans-serif'; x.fillStyle = '#8A93A6'; x.fillText(`Constancia generada en línea · Código ${d.code}`, W - 100, H - 100);
    return c.toDataURL('image/png');
  }

        <section class="glass pad chart"><h3>Formados por generación</h3><p>Personas con al menos una asistencia</p>${vbars(byGen, GENS.map(g => g.n), GENS.map(g => g.c))}</section>
        <section class="glass pad chart"><h3>Formados por coordinación</h3><p>Personas con al menos una asistencia</p>${hbars(byCoord)}</section>
        <section class="glass pad chart"><h3>Culminación por coordinación</h3><p>% de registrados con ${C} o más asistencias</p>${hbars(culmCoord)}</section>
        <section class="glass pad chart"><h3>Asistentes por sesión</h3><p>Últimas ${ses.length} sesiones</p>${ses.length ? hbars(ses.map(([id, s]) => [`${s.fecha ? s.fecha.slice(8, 10) + '/' + s.fecha.slice(5, 7) : ''} · ${s.modulo}`, (bySes[id] || []).length, '#F2C12E'])) : '<p class="muted">Sin sesiones.</p>'}</section>
      </div></div>`;
  }
  function viewRepetidos() {
    // 1) one phone marking several people in the same session
    const dev = {};
    Object.values(S.mar).forEach(m => { const k = m.sesion + '|' + m.uid; (dev[k] = dev[k] || []).push(m); });
    const multi = Object.entries(dev).filter(([, ms]) => ms.length > 1);
    // 2) same name registered with different cédulas
    const byName = {};
    Object.entries(S.per).forEach(([h, p]) => { const k = normName(p.nombre); (byName[k] = byName[k] || []).push([h, p]); });
    const dupNames = Object.values(byName).filter(a => a.length > 1);
    const devHtml = multi.map(([k, ms]) => { const s = S.ses[ms[0].sesion] || {}; return `<div class="item"><div class="t"><b>${ms.length} personas desde un mismo teléfono</b><span>${esc(s.modulo || '')} · ${esc(s.fecha ? fmtFecha(s.fecha) : '')}</span></div>
      <div class="t">${ms.map(m => { const p = S.per[m.persona] || {}; return `<div>${esc(p.nombre || '¿?')} <span class="muted">· ${hora(tsMs(m.t))}</span> <button class="btn sm" data-delm="${esc(m.sesion + '_' + m.persona)}" title="Quitar esta asistencia">Quitar</button></div>`; }).join('')}</div></div>`; }).join('');
    const nameHtml = dupNames.map(a => `<div class="item"><div class="t"><b>${esc(a[0][1].nombre)}</b><span>Registrado ${a.length} veces con cédulas distintas: ${a.map(([, p]) => esc(p.cedula)).join(' · ')}</span></div><span class="badge b-warn">Revisar</span></div>`).join('');
    return `<div style="margin-top:14px;display:flex;flex-direction:column;gap:14px">
      <section class="glass pad"><h2>Mismo teléfono, varias personas</h2><p class="muted" style="font-size:14px">Puede ser alguien que no tiene teléfono y le prestaron uno, o alguien marcando por otro. Revisa y quita la asistencia si no estuvo.</p>
        <div class="list">${devHtml || '<p class="muted">Nada raro por ahora ✓</p>'}</div></section>
      <section class="glass pad"><h2>Mismo nombre, cédulas distintas</h2><p class="muted" style="font-size:14px">Posible error al escribir la cédula o registro doble.</p>
        <div class="list">${nameHtml || '<p class="muted">Nada raro por ahora ✓</p>'}</div></section>
      <section class="glass pad"><h2>Doble marca el mismo día</h2><p class="muted" style="margin:0">La app no deja que una misma cédula marque dos veces en la misma sesión: si lo intenta, le dice que ya estaba registrada.</p></section></div>`;
  }
  function viewAjustes() {
    return `<form class="glass pad" id="af" style="margin-top:14px;max-width:640px"><h2>Ajustes</h2>
      <label for="aC">Coordinaciones (una por línea)</label><textarea id="aC">${esc(S.cfg.coordinaciones.join('\n'))}</textarea>
      <label for="aN">Asistencias para culminar</label><input id="aN" type="number" min="1" max="60" value="${S.cfg.culminar || 5}">
      <button class="btn primary" type="submit">Guardar</button></form>`;
  }
  function bind() {
    const nf = $('#nf'); if (nf && !nf.dataset.b) nf.dataset.b = 1, nf.addEventListener('submit', async e => {
      e.preventDefault();
      const mod = $('#nfM').value.trim(), f = FORMACIONES.find(x => formFull(x) === mod);
      const id = newId(), data = { fecha: $('#nfF').value, modulo: mod, deck: f ? f.deck : '', coordinacion: $('#nfC').value, lugar: $('#nfL').value.trim(), abierta: true, creada: Date.now() };
      try { await DB.saveSesion(id, data); toast('Sesión creada y abierta'); openProj(id); } catch (err) { toast('No se pudo crear (¿reglas de Firestore?)'); }
    });
    const mi = $('#nfM'); if (mi && !mi.dataset.b) { mi.dataset.b = 1; modulePicker(mi); }
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => { const s = S.ses[b.dataset.toggle]; try { await DB.saveSesion(b.dataset.toggle, { abierta: !s.abierta }); } catch (e) { toast('No se pudo cambiar'); } });
    document.querySelectorAll('[data-proj]').forEach(b => b.onclick = () => openProj(b.dataset.proj));
    document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(linkOf(b.dataset.copy)); toast('Enlace copiado'); } catch (e) { prompt('Copia el enlace:', linkOf(b.dataset.copy)); } });
    const q = $('#q'); if (q && !q.dataset.b) q.dataset.b = 1, q.addEventListener('input', () => { S.q = q.value; render(); });
    document.querySelectorAll('[data-per]').forEach(r => r.onclick = () => { S.det = r.dataset.per; $('#det').innerHTML = detalle(S.det); bind(); $('#det').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    document.querySelectorAll('[data-delm]').forEach(b => b.onclick = async () => { if (!confirm('¿Quitar esta asistencia?')) return; try { await DB.deleteMarca(b.dataset.delm); toast('Asistencia quitada'); } catch (e) { toast('No se pudo quitar'); } });
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editSesion(b.dataset.edit));
    document.querySelectorAll('[data-print]').forEach(b => b.onclick = () => printList(b.dataset.print));
    const ep = $('#edP'); if (ep && !ep.dataset.b) ep.dataset.b = 1, ep.addEventListener('submit', async e => {
      e.preventDefault();
      const nombre = $('#epN').value.replace(/\s+/g, ' ').trim(), edad = +$('#epE').value.replace(/\D/g, ''), coord = $('#epC').value;
      if (nombre.split(' ').length < 2) { $('#epM').textContent = 'Escribe nombre y apellido.'; return; }
      if (!(edad >= 15 && edad <= 110)) { $('#epM').textContent = 'Escribe una edad válida.'; return; }
      try { await DB.updatePersona(ep.dataset.h, { nombre, edad, gen: genOf(edad), coord }); document.activeElement && document.activeElement.blur(); toast('Datos corregidos'); render(); }
      catch (err) { $('#epM').textContent = 'No se pudo guardar. Revisa el internet e intenta de nuevo.'; }
    });
    const af = $('#af'); if (af && !af.dataset.b) af.dataset.b = 1, af.addEventListener('submit', async e => {
      e.preventDefault();
      const c = { coordinaciones: $('#aC').value.split('\n').map(s => s.trim()).filter(Boolean), culminar: Math.max(1, +$('#aN').value || 5) };
      try { await DB.setConfig(c); S.cfg = c; toast('Ajustes guardados'); } catch (err) { toast('No se pudo guardar'); }
    });
  }
  // grouped, searchable module list in the Alcaldía style; free text still allowed
  function modulePicker(inp) {
    const wrap = $('#mw'), panel = $('#mp');
    const MODS = FORMACIONES.map((f, i) => ({ full: formFull(f), g: 'Formaciones', c: f.c, num: String(i + 1), title: f.t, sub: f.s }));
    let act = -1, shown = [];
    const draw = () => {
      const q = normName(inp.value);
      shown = MODS.filter(m => !q || normName(m.full).includes(q) || MODS.some(x => x.full === inp.value));
      let html = '', last = '';
      shown.forEach((m, i) => {
        if (m.g !== last) { html += `<div class="mgen"><i style="background:#F4C20D"></i>${esc(m.g)}</div>`; last = m.g; }
        html += `<button type="button" class="mopt${i === act ? ' act' : ''}" role="option" data-i="${i}"><b style="background:${m.c};color:#fff"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M22 9.5 12 4.5 2 9.5l10 5 10-5Z"/><path d="M6 11.5V17c3.3 2.4 8.7 2.4 12 0v-5.5"/><path d="M22 9.5v5"/></svg></b><span><strong style="display:block">${esc(m.title)}</strong><span class="muted" style="font-size:13.5px">${esc(m.sub)}</span></span></button>`;
      });
      panel.innerHTML = html || `<div class="mempty">Ninguna formación coincide. Puedes dejar lo que escribiste.</div>`;
      panel.querySelectorAll('.mopt').forEach(b => b.addEventListener('mousedown', e => { e.preventDefault(); pick(+b.dataset.i); }));
    };
    const open = () => { act = -1; draw(); panel.hidden = false; wrap.classList.add('open'); inp.setAttribute('aria-expanded', 'true'); };
    const close = () => { panel.hidden = true; wrap.classList.remove('open'); inp.setAttribute('aria-expanded', 'false'); };
    const pick = i => { const m = shown[i]; if (!m) return; inp.value = m.full; close(); };
    inp.addEventListener('focus', open); inp.addEventListener('click', open);
    inp.addEventListener('input', () => { act = -1; if (panel.hidden) open(); else draw(); });
    inp.addEventListener('blur', () => setTimeout(close, 120));
    inp.addEventListener('keydown', e => {
      if (panel.hidden && (e.key === 'ArrowDown')) { open(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = Math.max(0, Math.min(shown.length - 1, act + (e.key === 'ArrowDown' ? 1 : -1))); draw(); const el = panel.querySelector('.mopt.act'); el && el.scrollIntoView({ block: 'nearest' }); }
      else if (e.key === 'Enter' && !panel.hidden && act >= 0) { e.preventDefault(); pick(act); }
      else if (e.key === 'Escape') close();
    });
  }
  /* editar los datos de una sesión (p. ej. la fecha equivocada); las asistencias marcadas no se tocan */
  function editSesion(id) {
    const s = S.ses[id]; if (!s) return;
    const coords = [...new Set([...S.cfg.coordinaciones, s.coordinacion].filter(Boolean))];
    const n = Object.values(S.mar).filter(m => m.sesion === id).length;
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:60;background:rgba(3,10,25,.72);display:flex;align-items:center;justify-content:center;padding:16px';
    ov.innerHTML = `<form class="glass pad" id="esF" style="width:min(560px,100%);background:#0F2C55;max-height:92vh;overflow:auto"><h2 style="margin-top:0">Editar sesión</h2>
      <p class="muted" style="font-size:14px;margin-top:-6px">${n === 1 ? 'La asistencia ya marcada se mantiene' : `Las ${n} asistencias ya marcadas se mantienen`}; solo cambian los datos de la sesión.</p>
      <label for="esD">Fecha</label><input id="esD" type="date" value="${esc(s.fecha || '')}" required>
      <label for="esM">Formación</label><input id="esM" maxlength="160" value="${esc(s.modulo || '')}" required>
      <label for="esC">Coordinación</label><select id="esC">${coords.map(c => `<option ${c === s.coordinacion ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <label for="esL">Lugar (opcional)</label><input id="esL" maxlength="80" value="${esc(s.lugar || '')}">
      <div class="row" style="margin-top:16px;gap:10px"><button class="btn primary" type="submit" style="flex:1;margin:0">Guardar</button><button class="btn" type="button" id="esX" style="flex:1">Cancelar</button></div></form>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    $('#esX').onclick = close;
    $('#esF').addEventListener('submit', async e => {
      e.preventDefault();
      const mod = $('#esM').value.trim(), f = FORMACIONES.find(x => formFull(x) === mod);
      const data = { fecha: $('#esD').value, modulo: mod, coordinacion: $('#esC').value, lugar: $('#esL').value.trim() };
      if (f) data.deck = f.deck;
      try { await DB.saveSesion(id, data); close(); toast('Sesión actualizada'); } catch (err) { toast('No se pudo guardar'); }
    });
    $('#esD').focus();
  }
  /* listado imprimible de una sesión (alfabético, con firma) + Excel */
  function printList(id) {
    const s = S.ses[id]; if (!s) return;
    const w = window.open('', '_blank'); if (!w) { toast('Permite las ventanas emergentes para imprimir'); return; }
    const fmtCed = c => c ? 'V-' + String(c).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    const rows = Object.values(S.mar).filter(m => m.sesion === id).map(m => { const p = S.per[m.persona] || {}; return { nom: p.nombre || '(sin registro)', ced: p.cedula || '', coord: p.coord || '', gen: (GENS[p.gen] || {}).n || '', t: tsMs(m.t) }; });
    const byName = (a, b) => normName(a.nom).localeCompare(normName(b.nom));
    const logo = new URL('logo/mara-logo.svg', location.href).href, gen = new Date().toLocaleString('es-VE', { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    const file = `Asistencia ${s.fecha || ''} ${String(s.modulo || '').slice(0, 40)}`.replace(/[\\/:*?"<>|]+/g, '').trim();
    const css = `@page{size:letter;margin:12mm 11mm}*{box-sizing:border-box}body{font:12px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0B1426;margin:0;padding:18px;background:#fff}
      .np{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#0A2346;color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:14px}
      .np button{font:600 14px system-ui;padding:9px 16px;border-radius:8px;border:0;cursor:pointer;background:#fff;color:#0A2346}.np button.p{background:#F4C20D}.np label{display:flex;gap:6px;align-items:center;cursor:pointer}.np span{opacity:.75;margin-left:auto}
      .band{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:12px}.band i{flex:1}
      header{display:flex;gap:16px;align-items:center;border-bottom:2px solid #0A2346;padding-bottom:10px}header img{height:62px}header small{display:block;color:#445066;font-size:11px;letter-spacing:.03em}header h1{margin:2px 0 0;font:700 19px Georgia,"Times New Roman",serif;letter-spacing:.04em}
      .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px;margin:12px 0 14px}.meta div{border-left:3px solid #F2C12E;padding:2px 0 2px 8px}.meta b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5A6478}.meta .wide{grid-column:span 2}
      table{width:100%;border-collapse:collapse}th{background:#0A2346;color:#fff;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px}td{border-bottom:1px solid #D5DAE3;padding:6px;vertical-align:top}
      tr{break-inside:avoid}td.n{color:#5A6478;width:28px;text-align:right}td.c{white-space:nowrap}td.f{width:120px}td small{color:#5A6478}tr.g td{background:#EEF3FA;font-weight:700;border-bottom:1px solid #9FB3D1;padding-top:9px}tr.g td em{font-style:normal;font-weight:400;color:#5A6478}
      h2{font:700 13px system-ui;margin:20px 0 6px;text-transform:uppercase;letter-spacing:.05em}.res{width:auto;min-width:50%}.res td:last-child{text-align:right;font-weight:700}
      .firmas{display:flex;gap:60px;margin-top:56px;break-inside:avoid}.firmas div{flex:1;border-top:1px solid #0B1426;padding-top:6px;text-align:center;font-size:11px}
      .pie{margin-top:18px;color:#8A93A6;font-size:10px;display:flex;justify-content:space-between}
      @media print{body{padding:0}.np{display:none}th,tr.g td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}`;
    w.document.open();
    w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(file)}</title><style>${css}</style></head><body>
      <div class="np"><button class="p" id="pp">Imprimir / guardar PDF</button><button id="xl">Descargar Excel</button><span>${rows.length} asistentes</span></div>
      <div id="doc"></div></body></html>`);
    w.document.close();
    const draw = () => {
      const list = rows.slice().sort(byName);
      const body = list.map((r, i) => `<tr><td class="n">${i + 1}</td><td><b>${esc(r.nom)}</b>${r.gen ? `<br><small>Generación ${esc(r.gen)}</small>` : ''}</td><td class="c">${esc(fmtCed(r.ced))}</td>
          <td><small>${esc(r.coord)}</small></td><td class="c">${esc(hora(r.t))}</td><td class="f"></td></tr>`).join('');
      w.document.getElementById('doc').innerHTML = `<div class="band"><i style="background:#1E9E4F"></i><i style="background:#F2C12E"></i><i style="background:#2F80ED"></i><i style="background:#D62839"></i></div>
        <header><img src="${logo}" alt="Alcaldía Bolivariana de Mara"><div><small>ALCALDÍA BOLIVARIANA DE MARA · DIRECCIÓN GENERAL · DIRECCIÓN DE PLANIFICACIÓN Y DESARROLLO</small><h1>LISTADO DE ASISTENCIA</h1></div></header>
        <div class="meta"><div class="wide"><b>Formación</b>${esc(s.modulo || '')}</div><div><b>Fecha</b>${esc(fmtFecha(s.fecha))}</div>
          <div><b>Coordinación</b>${esc(s.coordinacion || '—')}</div><div><b>Lugar</b>${esc(s.lugar || '—')}</div><div><b>Asistentes</b>${rows.length}${s.abierta ? ' · sesión aún abierta' : ' · sesión cerrada'}</div></div>
        <table><thead><tr><th>N°</th><th>Nombre y apellido</th><th>Cédula</th><th>Coordinación</th><th>Hora</th><th>Firma</th></tr></thead>
        <tbody>${body || '<tr><td colspan="6">Nadie marcó asistencia en esta sesión.</td></tr>'}</tbody></table>
        <div class="firmas"><div>Facilitador(a)</div><div>Responsable de la coordinación</div></div>
        <div class="pie"><span>Generado el ${esc(gen)}</span><span>Plan de Formación · Alcaldía Bolivariana de Mara</span></div>`;
    };
    draw();
    w.document.getElementById('pp').onclick = () => w.print();
    w.document.getElementById('xl').onclick = () => {
      const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const list = rows.slice().sort(byName);
      const csv = '﻿' + [['N°', 'Nombre y apellido', 'Cédula', 'Coordinación', 'Generación', 'Hora'].map(q).join(';'),
        ...list.map((r, i) => [i + 1, r.nom, r.ced, r.coord, r.gen, hora(r.t)].map(q).join(';'))].join('\r\n');
      const a = w.document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = file + '.csv'; w.document.body.appendChild(a); a.click(); a.remove();
    };
  }
  const linkOf = id => { const u = new URL(location.href); u.search = (DB.demo ? '?demo&' : '?') + 's=' + id; u.hash = ''; return u.toString(); };

  /* projector: big QR + live counter */
  let projId = null;
  function drawQR(canvas, text, px) {
    const L = window.QRCodeLib, q = new L.QRCode(-1, L.QRErrorCorrectLevel.M); q.addData(text); q.make();
    const n = q.getModuleCount(), quiet = 2, size = (n + quiet * 2) * px; canvas.width = size; canvas.height = size;
    const c = canvas.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, size, size); c.fillStyle = '#0A2346';
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) c.fillRect((col + quiet) * px, (r + quiet) * px, px, px);
  }
  function openProj(id) {
    projId = id; const s = S.ses[id] || {};
    let el = $('#proj'); if (!el) { el = document.createElement('div'); el.id = 'proj'; document.body.appendChild(el); }
    el.innerHTML = `<canvas id="qr" aria-label="Código QR de asistencia"></canvas>
      <div class="pt"><div class="eyebrow">Registro de asistencia · ${esc(fmtFecha(s.fecha))}</div><h1>${esc(s.modulo || '')}</h1>
      <p>${esc(s.coordinacion || '')}${s.lugar ? ' · ' + esc(s.lugar) : ''}</p>
      <p style="color:#fff;font-weight:700">Escanea el código con la cámara de tu teléfono y escribe tu cédula.</p>
      <div class="count"><span id="pc">0</span><small>ASISTENTES</small></div><div class="recent" id="pr"></div><p class="url">${esc(linkOf(id))}</p></div>
      <button class="btn x" id="px">✕ Cerrar</button>`;
    drawQR($('#qr'), linkOf(id), 12);
    $('#px').onclick = () => { el.remove(); projId = null; };
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    updateProj();
  }
  function updateProj() {
    if (!projId || !$('#pc')) return;
    const ms = Object.values(S.mar).filter(m => m.sesion === projId).sort((a, b) => tsMs(b.t) - tsMs(a.t));
    $('#pc').textContent = ms.length;
    $('#pr').innerHTML = ms.slice(0, 8).map(m => { const p = S.per[m.persona]; return p ? `<span>${esc(firstName(p.nombre))} ${esc((p.nombre.split(' ')[1] || '').slice(0, 1))}.</span>` : ''; }).join('');
  }

  if (ADMIN) admin(); else if (SID) participant(); else if (P.has('constancia')) constancia();
  else root.innerHTML = `<div class="wrap"><header class="top">${brand('Registro de asistencia')}</header><div class="glass pad"><h2>Escanea el código QR</h2><p class="muted">Para marcar tu asistencia, escanea el código QR que proyecta el facilitador en la sesión.</p></div></div>`;
})();
</script>
</body>
</html>
